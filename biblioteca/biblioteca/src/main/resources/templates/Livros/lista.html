
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Livros</title>
</head>
<body>

<h1>Livros cadastrados</h1>

<p>
    <a th:href="@{/Livros/novo}">Cadastrar novo livro</a>
</p>

<p>
    Total de livros:
    <span th:text="${livros.size()}"></span>
</p>

<table border="1">
    <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="livro, status : ${livros}">
            <td th:text="${livro.titulo}"></td>
            <td th:text="${livro.autor}"></td>
            <td th:text="${livro.ISBN}"></td>
            <td>
                <a th:href="@{/Livros/excluir/{indice}(indice=${status.index})}">Excluir</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
