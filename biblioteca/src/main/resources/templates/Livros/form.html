
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
</head>
<body>

<!-- Lembrete d rodar BibliotecaAplication e colar o url:
http://localhost:8080/Livros/novo
O .html está abrindo na port 63342, rodando sem o thymeleaf.
Por isso que redirecionava p si msm. (n sei como resolve) -->

<h1>Cadastrar Livro</h1>

<form th:object="${livro}"
      th:action="@{/Livros}"
      method="post">

    <label for="titulo">Título:</label>
    <input type="text" id="titulo"
           th:field="*{titulo}" required>

    <br><br>

    <label for="autor">Autor:</label>
    <input type="text" id="autor"
           th:field="*{autor}" required>

    <br><br>

    <label for="isbn">ISBN:</label>
    <input type="text" id="isbn"
           th:field="*{ISBN}" required>

    <br><br>

    <button type="submit">Cadastrar</button>

</form>

</body>
</html>
